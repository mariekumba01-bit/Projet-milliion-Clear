services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clearmatch
      POSTGRES_USER: clearmatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearmatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://clearmatch:${DB_PASSWORD}@db:5432/clearmatch
      APP_SECRET_KEY: ${APP_SECRET_KEY:?générer avec openssl rand -hex 32}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?générer avec openssl rand -hex 24}
      SASPAY_API_KEY: ${SASPAY_API_KEY:-}
      SASPAY_WEBHOOK_SECRET: ${SASPAY_WEBHOOK_SECRET:-}
      PENNYLANE_CLIENT_ID: ${PENNYLANE_CLIENT_ID:-}
      PENNYLANE_CLIENT_SECRET: ${PENNYLANE_CLIENT_SECRET:-}
      NODE_ENV: production
    ports:
      - "8080:8080"

volumes:
  pgdata:
